spring:
  application:
    name: igrejahub-backend
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:igrejahub}
    username: ${DB_USER:igrejahub}
    password: ${DB_PASSWORD:igrejahub123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

logging:
  level:
    com.igrejahub: ${LOG_LEVEL:INFO}
    org.springframework.security: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SHOW_SQL:false}
    org.hibernate.type.descriptor.sql.BasicBinder: ${SHOW_SQL:false}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

jwt:
  secret: ${JWT_SECRET:${JWT_SECRET:default-secret-key-change-in-production-very-long-secret-key-for-hs512}}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900} # 15 minutes
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800} # 7 days

security:
  rate-limit:
    max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:5}
    block-duration: ${RATE_LIMIT_BLOCK_DURATION:900} # 15 minutes

storage:
  type: ${STORAGE_TYPE:local}
  local:
    upload-dir: ${STORAGE_LOCAL_UPLOAD_DIR:./uploads}
  s3:
    endpoint: ${STORAGE_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:}
  
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  root-email: ${ROOT_EMAIL:admin@igrejahub.com}
  root-password: ${ROOT_PASSWORD:Root@2024#Secure}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    persist-authorization: true
  show-actuator: true